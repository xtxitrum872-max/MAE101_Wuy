<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Đề thi AI và Ma trận nghịch đảo</title>

  <!-- MathJax -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)'], ['$', '$']]
      }
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f2f5f9;
      margin:0;
      padding:20px;
      color:#222;
    }

    .container{
      max-width:1100px;
      margin:auto;
    }

    h1{
      text-align:center;
      color:#0057a8;
    }

    .subtitle{
      text-align:center;
      margin-bottom:30px;
      color:#555;
    }

    .question{
      background:white;
      padding:20px;
      border-radius:15px;
      margin-bottom:25px;
      box-shadow:0 4px 10px rgba(0,0,0,0.08);
    }

    .question h3{
      color:#004080;
    }

    .difficulty{
      display:inline-block;
      padding:5px 10px;
      border-radius:8px;
      font-size:13px;
      margin-bottom:10px;
      color:white;
    }

    .easy{
      background:#2ecc71;
    }

    .medium{
      background:#f39c12;
    }

    .hard{
      background:#e74c3c;
    }

    .theory{
      background:#3498db;
    }

    .option{
      border:2px solid #ddd;
      padding:12px;
      border-radius:10px;
      margin-top:10px;
      cursor:pointer;
      transition:0.3s;
    }

    .option:hover{
      background:#f1f1f1;
    }

    .correct{
      background:#c8f7c5 !important;
      border-color:#27ae60 !important;
    }

    .wrong{
      background:#ffd6d6 !important;
      border-color:#e74c3c !important;
    }

    .explanation{
      margin-top:15px;
      padding:15px;
      border-left:5px solid #3498db;
      background:#eef7ff;
      border-radius:10px;
      display:none;
    }

    .tip{
      margin-top:10px;
      background:#fff8d9;
      padding:10px;
      border-left:5px solid #f1c40f;
      border-radius:8px;
    }

    .score-box{
      position:sticky;
      top:10px;
      background:white;
      padding:15px;
      border-radius:15px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
      margin-bottom:20px;
      text-align:center;
      font-size:20px;
      font-weight:bold;
      color:#0057a8;
    }

    .download-btn{
      display:block;
      width:300px;
      margin:30px auto;
      text-align:center;
      background:#0057a8;
      color:white;
      padding:15px;
      border-radius:12px;
      text-decoration:none;
      font-size:18px;
      transition:0.3s;
    }

    .download-btn:hover{
      background:#003f7a;
    }

  </style>
</head>
<body>

<div class="container">

  <h1>ĐỀ THI TƯƠNG TÁC</h1>
  <div class="subtitle">
    AI và Giáo dục – Ma trận nghịch đảo – Harnessing AI
  </div>

  <div class="score-box">
    Điểm hiện tại: <span id="score">0</span>/20
  </div>

  <div id="quiz"></div>

  <a class="download-btn" id="downloadBtn">
    📥 Download File HTML
  </a>

</div>

<script>

const questions = [

  // =========================
  // LÝ THUYẾT (1-5)
  // =========================

  {
    type:"Lý thuyết",
    level:"theory",
    question:"Ba trụ cột của AI theo bài giảng là gì?",
    options:[
      "Prompt – Context – Harnessing",
      "ChatGPT – Claude – Gemini",
      "Toán – Lý – Hóa",
      "Deep Learning – AI – Data"
    ],
    correct:0,
    explanation:"Theo bài giảng, Prompt là câu lệnh, Context là ngữ cảnh và Harnessing là ghì cương AI.",
    tip:"Mẹo: bộ ba này xuất hiện rất nhiều lần trong bài giảng."
  },

  {
    type:"Lý thuyết",
    level:"theory",
    question:"Vai trò mới của người thầy trong thời đại AI là gì?",
    options:[
      "Giảng bài thật nhiều",
      "Làm PowerPoint đẹp",
      "Chỉ cách học và điều khiển AI",
      "Cho điểm nhanh hơn"
    ],
    correct:2,
    explanation:"Bài giảng nhấn mạnh: 'Thầy không dạy – thầy chỉ cách'.",
    tip:"Nhớ hình ảnh 'ghì cương con ngựa AI'."
  },

  {
    type:"Lý thuyết",
    level:"theory",
    question:"Harnessing nghĩa là gì?",
    options:[
      "Tắt AI",
      "Ghì cương và điều khiển AI",
      "Cho AI tự hoạt động",
      "Lập trình AI"
    ],
    correct:1,
    explanation:"Harnessing là ghì cương AI để nó đi đúng hướng.",
    tip:"Liên tưởng tới người cưỡi ngựa."
  },

  {
    type:"Lý thuyết",
    level:"theory",
    question:"Theo bài giảng, AI clone giáo viên để làm gì?",
    options:[
      "Thay thế hoàn toàn giáo viên",
      "Nhân bản phong cách dạy học",
      "Tạo game",
      "Viết sách giáo khoa"
    ],
    correct:1,
    explanation:"AI có thể bắt chước phong cách giảng dạy của giáo viên.",
    tip:"Từ khóa: 'clone phong cách'."
  },

  {
    type:"Lý thuyết",
    level:"theory",
    question:"Theo bài giảng, học sinh nên học gì?",
    options:[
      "Học thuộc công thức",
      "Học mẹo máy móc",
      "Học tư duy",
      "Học chép bài"
    ],
    correct:2,
    explanation:"Triết lý chính là học tư duy thay vì học thuộc.",
    tip:"Câu quote cuối bài xuất hiện ý này."
  },

  // =========================
  // DỄ (6-10)
  // =========================

  {
    type:"Dễ",
    level:"easy",
    question:"Tính \\(\\det(A)\\) với \\(A = \\begin{pmatrix}2 & 1\\\\1 & 3\\end{pmatrix}\\)",
    options:["5","6","4","7"],
    correct:0,
    explanation:"\\(\\det(A)=2\\cdot3-1\\cdot1=6-1=5\\)",
    tip:"Ma trận 2x2: ad - bc."
  },

  {
    type:"Dễ",
    level:"easy",
    question:"Công thức nghịch đảo ma trận là:",
    options:[
      "\\(A^{-1}=A^T\\)",
      "\\(A^{-1}=\\frac{1}{\\det(A)}adj(A)\\)",
      "\\(A^{-1}=A+A\\)",
      "\\(A^{-1}=det(A)\\)"
    ],
    correct:1,
    explanation:"Đây là công thức chuẩn của ma trận nghịch đảo.",
    tip:"Nhớ có determinant ở mẫu."
  },

  {
    type:"Dễ",
    level:"easy",
    question:"Nếu \\(\\det(A)=0\\) thì:",
    options:[
      "A khả nghịch",
      "A có nghịch đảo",
      "A không khả nghịch",
      "A luôn là ma trận đơn vị"
    ],
    correct:2,
    explanation:"Định thức bằng 0 thì không chia được nên không tồn tại nghịch đảo.",
    tip:"det = 0 => không nghịch đảo."
  },

  {
    type:"Dễ",
    level:"easy",
    question:"Minor \\(M_{ij}\\) là gì?",
    options:[
      "Định thức ma trận con",
      "Định thức toàn ma trận",
      "Ma trận chuyển vị",
      "Ma trận đơn vị"
    ],
    correct:0,
    explanation:"Minor là định thức ma trận con sau khi bỏ hàng và cột.",
    tip:"Minor = matrix nhỏ."
  },

  {
    type:"Dễ",
    level:"easy",
    question:"Cofactor được tính bằng:",
    options:[
      "\\(C_{ij}=M_{ij}\\)",
      "\\(C_{ij}=(-1)^{i+j}M_{ij}\\)",
      "\\(C_{ij}=det(A)\\)",
      "\\(C_{ij}=A^{-1}\\)"
    ],
    correct:1,
    explanation:"Cofactor có thêm dấu \\((-1)^{i+j}\\).",
    tip:"Quan trọng dấu + - xen kẽ."
  },

  // =========================
  // TRUNG BÌNH (11-15)
  // =========================

  {
    type:"Trung bình",
    level:"medium",
    question:"Cho \\(A=\\begin{pmatrix}4&2\\\\1&3\\end{pmatrix}\\). Tính định thức.",
    options:["10","12","8","6"],
    correct:0,
    explanation:"\\(4\\cdot3-2\\cdot1=12-2=10\\)",
    tip:"Nhân đường chéo chính rồi trừ chéo phụ."
  },

  {
    type:"Trung bình",
    level:"medium",
    question:"Cho \\(A=\\begin{pmatrix}1&2\\\\3&4\\end{pmatrix}\\). \\(A^{-1}\\) là:",
    options:[
      "\\(\\begin{pmatrix}-2&1\\\\1.5&-0.5\\end{pmatrix}\\)",
      "\\(\\begin{pmatrix}2&1\\\\3&4\\end{pmatrix}\\)",
      "\\(\\begin{pmatrix}1&0\\\\0&1\\end{pmatrix}\\)",
      "\\(\\begin{pmatrix}4&-2\\\\-3&1\\end{pmatrix}\\)"
    ],
    correct:0,
    explanation:"\\(det=-2\\), áp dụng công thức nghịch đảo.",
    tip:"Đổi vị trí a,d rồi đổi dấu b,c."
  },

  {
    type:"Trung bình",
    level:"medium",
    question:"Adjugate là gì?",
    options:[
      "Ma trận định thức",
      "Ma trận chuyển vị của cofactor",
      "Ma trận nghịch đảo",
      "Ma trận đơn vị"
    ],
    correct:1,
    explanation:"Adj(A)=C^T",
    tip:"Adjugate = transpose cofactor."
  },

  {
    type:"Trung bình",
    level:"medium",
    question:"Nếu \\(A\\cdot A^{-1}=I\\) thì I là:",
    options:[
      "Ma trận nghịch đảo",
      "Ma trận đơn vị",
      "Ma trận chuyển vị",
      "Ma trận 0"
    ],
    correct:1,
    explanation:"I là identity matrix.",
    tip:"I = identity."
  },

  {
    type:"Trung bình",
    level:"medium",
    question:"Cho \\(A=\\begin{pmatrix}2&0\\\\0&2\\end{pmatrix}\\), nghịch đảo là:",
    options:[
      "\\(\\begin{pmatrix}2&0\\\\0&2\\end{pmatrix}\\)",
      "\\(\\begin{pmatrix}0.5&0\\\\0&0.5\\end{pmatrix}\\)",
      "\\(\\begin{pmatrix}1&0\\\\0&1\\end{pmatrix}\\)",
      "\\(\\begin{pmatrix}0&2\\\\2&0\\end{pmatrix}\\)"
    ],
    correct:1,
    explanation:"Vì đây là ma trận chéo nên chỉ cần lấy nghịch đảo từng phần tử.",
    tip:"Ma trận chéo rất dễ xử lý."
  },

  // =========================
  // KHÓ (16-20)
  // =========================

  {
    type:"Khó",
    level:"hard",
    question:"Cho \\(A=\\begin{pmatrix}3&1\\\\2&1\\end{pmatrix}\\). Tính \\(A^{-1}\\)",
    options:[
      "\\(\\begin{pmatrix}1&-1\\\\-2&3\\end{pmatrix}\\)",
      "\\(\\begin{pmatrix}1&1\\\\2&3\\end{pmatrix}\\)",
      "\\(\\begin{pmatrix}3&-1\\\\-2&1\\end{pmatrix}\\)",
      "\\(\\begin{pmatrix}0&1\\\\1&0\\end{pmatrix}\\)"
    ],
    correct:0,
    explanation:"det=1 nên nghịch đảo chính là ma trận đổi chỗ và đổi dấu.",
    tip:"Nếu det = 1 thì khỏi chia."
  },

  {
    type:"Khó",
    level:"hard",
    question:"Cho \\(A=\\begin{pmatrix}5&2\\\\2&1\\end{pmatrix}\\). det(A)=?",
    options:["1","5","9","3"],
    correct:0,
    explanation:"\\(5\\cdot1-2\\cdot2=5-4=1\\)",
    tip:"det=1 thường xuất hiện trong đề khó."
  },

  {
    type:"Khó",
    level:"hard",
    question:"Ma trận nào sau đây KHÔNG khả nghịch?",
    options:[
      "\\(\\begin{pmatrix}1&2\\\\2&4\\end{pmatrix}\\)",
      "\\(\\begin{pmatrix}1&0\\\\0&1\\end{pmatrix}\\)",
      "\\(\\begin{pmatrix}2&1\\\\1&3\\end{pmatrix}\\)",
      "\\(\\begin{pmatrix}3&0\\\\0&2\\end{pmatrix}\\)"
    ],
    correct:0,
    explanation:"det = 1*4 - 2*2 = 0 nên không khả nghịch.",
    tip:"Hai hàng tỉ lệ => det = 0."
  },

  {
    type:"Khó",
    level:"hard",
    question:"Nếu \\(A^{-1}=A\\) thì A gọi là:",
    options:[
      "Ma trận trực giao",
      "Ma trận tự nghịch đảo",
      "Ma trận đơn vị",
      "Ma trận chéo"
    ],
    correct:1,
    explanation:"A nhân với chính nó ra I.",
    tip:"Self-inverse matrix."
  },

  {
    type:"Khó",
    level:"hard",
    question:"Cho \\(A=\\begin{pmatrix}0&1\\\\1&0\\end{pmatrix}\\). \\(A^{-1}\\)=?",
    options:[
      "\\(A\\)",
      "\\(-A\\)",
      "\\(I\\)",
      "\\(0\\)"
    ],
    correct:0,
    explanation:"A.A = I nên A tự là nghịch đảo của chính nó.",
    tip:"Nhân thử nhanh sẽ thấy."
  }

];

const quiz = document.getElementById("quiz");
const scoreEl = document.getElementById("score");

let score = 0;

questions.forEach((q,index)=>{

  const div = document.createElement("div");
  div.className = "question";

  div.innerHTML = `
    <div class="difficulty ${q.level}">
      ${q.type}
    </div>

    <h3>Câu ${index+1}: ${q.question}</h3>
  `;

  q.options.forEach((opt,i)=>{

    const btn = document.createElement("div");
    btn.className = "option";
    btn.innerHTML = opt;

    btn.onclick = ()=>{

      if(div.classList.contains("done")) return;
      div.classList.add("done");

      const options = div.querySelectorAll(".option");

      options.forEach(o=>o.style.pointerEvents="none");

      if(i===q.correct){
        btn.classList.add("correct");
        score++;
        scoreEl.textContent = score;
      }else{
        btn.classList.add("wrong");
        options[q.correct].classList.add("correct");
      }

      explanation.style.display="block";

      MathJax.typesetPromise();
    };

    div.appendChild(btn);

  });

  const explanation = document.createElement("div");
  explanation.className = "explanation";

  explanation.innerHTML = `
    <b>Đáp án đúng:</b> ${String.fromCharCode(65+q.correct)}<br><br>
    <b>Giải thích:</b> ${q.explanation}

    <div class="tip">
      💡 <b>Mẹo làm nhanh:</b> ${q.tip}
    </div>
  `;

  div.appendChild(explanation);

  quiz.appendChild(div);

});

MathJax.typesetPromise();


// DOWNLOAD FILE HTML

document.getElementById("downloadBtn").addEventListener("click", function(){

  const htmlContent = document.documentElement.outerHTML;

  const blob = new Blob([htmlContent], {type:"text/html"});

  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "de_thi_AI_ma_tran_nghich_dao.html";
  a.click();

  URL.revokeObjectURL(url);
});

</script>

</body>
</html>
